<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>404 - Page Not Found | STACKLY</title>

  <link rel="icon" href="assets/images/logo/stackly_logo.webp">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --cyan: #19dcff;
      --blue: #3f8cff;
      --violet: #7b45ff;

      --bg: #020711;

      --white: #f2f9ff;
      --muted: #8aa0b5;

      --line: rgba(90, 190, 255, 0.20);
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overflow-y: hidden;
    }


    html {
      background: var(--bg);
    }


    body {
      width: 100%;
      min-height: 100svh;

      overflow: hidden;

      font-family: "Space Grotesk", sans-serif;

      color: var(--white);

      background: var(--bg);

      overscroll-behavior: none;
    }


    /* =========================================================
       FULL-SCREEN ONLINE TECH BACKGROUND
       Online image loads first; embedded SVG is the fallback.
    ========================================================= */

    .background-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        linear-gradient(rgba(1,6,16,.12), rgba(1,6,16,.34)),
        url("assets/images/404/01.webp")
        center / cover no-repeat,
        #020711;
    }

    .background-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      opacity: .90;
      filter: saturate(1.05) contrast(1.04) brightness(.96);
      transform: scale(1.02);
    }

    .background-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(1,6,16,.10), rgba(1,6,16,.30)),
        radial-gradient(circle at 50% 42%, rgba(25,220,255,.08), transparent 36%),
        linear-gradient(90deg, rgba(1,6,16,.08), transparent 50%, rgba(1,6,16,.10));
      pointer-events: none;
    }

    @keyframes backgroundDrift {
      from { transform: scale(1.02); }
      to   { transform: scale(1.05); }
    }

    .background-photo {
      animation: backgroundDrift 20s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* =========================================================
       MAIN SCREEN
    ========================================================= */

    .error-page {

      width: 100%;

      height: 100svh;

      min-height: 100svh;

      overflow: hidden;
      overflow-x: hidden;
      overflow-y: hidden;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

      position: relative;
      z-index: 1;

      isolation: isolate;
    }
    /* =========================================================
       CENTER CONTENT
    ========================================================= */

    .error-content {

      width: min(1100px, 100%);

      text-align: center;

      position: relative;

      z-index: 5;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }


    /* =========================================================
       STACKLY LABEL
    ========================================================= */

    .error-brand {

      margin-bottom: 10px;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 7px;

      color: #ffffff;
    }


    .error-tagline {

      margin-bottom: 23px;

      padding: 8px 16px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      font-size: 8px;

      letter-spacing: 5px;

      color: #bfe9ff;

      text-transform: uppercase;

      background: rgba(2, 10, 22, 0.48);

      border: 1px solid rgba(78, 190, 255, 0.13);

      border-radius: 999px;

      backdrop-filter: blur(9px);

      -webkit-backdrop-filter: blur(9px);

      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.80);

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);

      position: relative;

      z-index: 2;
    }


    /* =========================================================
       404 NUMBER
    ========================================================= */

    .error-number {

      position: relative;

      font-size: clamp(
        170px,
        25vw,
        360px
      );

      line-height: 0.72;

      letter-spacing: -18px;

      font-weight: 700;

      user-select: none;

      background:

        linear-gradient(
          110deg,
          #f4fbff 5%,
          var(--cyan) 36%,
          #8bc9ff 61%,
          var(--violet) 96%
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(0 0 20px rgba(25, 220, 255, 0.16))
        drop-shadow(0 0 55px rgba(25, 220, 255, 0.08));
    }


    /* =========================================================
       ERROR TITLE
    ========================================================= */

    .error-title {

      margin-top: 30px;

      font-size: clamp(
        28px,
        4vw,
        48px
      );

      font-weight: 500;

      letter-spacing: 7px;

      text-transform: uppercase;

      color: #f2f9ff;
    }


    .error-title span {

      background:

        linear-gradient(
          100deg,
          var(--cyan),
          #8fcaff,
          var(--violet)
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    .error-message {

      width: min(700px, 100%);

      margin: 18px auto 0;

      padding: 11px 18px;

      color: #dbeeff;

      font-size: 13px;

      line-height: 1.8;

      text-align: center;

      background: rgba(2, 10, 22, 0.52);

      border: 1px solid rgba(78, 190, 255, 0.14);

      border-radius: 12px;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .error-actions {

      margin-top: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    .error-btn {

      min-height: 52px;

      padding: 0 25px;

      border-radius: 12px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      text-decoration: none;

      font-size: 10px;

      font-weight: 800;

      letter-spacing: 0.3px;

      cursor: pointer;

      border: 1px solid var(--line);

      font-family: inherit;
    }


    /* PRIMARY */

    .error-btn-primary {

      color: #001018;

      border: none;

      background:

        linear-gradient(
          105deg,
          var(--cyan),
          #55b8ff 55%,
          var(--violet)
        );

      box-shadow:
        0 14px 35px rgba(25, 220, 255, 0.14);
    }


    /* SECONDARY */

    .error-btn-secondary {

      color: #e1f2ff;

      background: rgba(4, 14, 26, 0.70);

      backdrop-filter: blur(15px);

      -webkit-backdrop-filter: blur(15px);
    }


    /* =========================================================
       SMALL INFO LINE
    ========================================================= */

    .error-info {

      margin-top: 25px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;

      color: #b9d7ea;

      font-size: 8px;

      letter-spacing: 1.4px;

      position: relative;

      z-index: 2;
    }


    .error-info span {

      min-height: 34px;

      padding: 0 12px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      color: #bfe3f6;

      background: rgba(2, 10, 22, 0.50);

      border: 1px solid rgba(78, 190, 255, 0.13);

      border-radius: 999px;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      text-shadow: 0 1px 7px rgba(0, 0, 0, 0.78);

      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.14);
    }


    .error-info i {

      color: var(--cyan);

      font-size: 8px;

      filter: drop-shadow(0 0 5px rgba(25, 220, 255, 0.35));
    }


    /* =========================================================
       DECORATIVE GLOW
    ========================================================= */

    .center-glow {

      position: absolute;

      width: 500px;

      height: 500px;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -45%);

      border-radius: 50%;

      background:

        radial-gradient(
          circle,
          rgba(25, 220, 255, 0.08),
          transparent 68%
        );

      pointer-events: none;

      z-index: -1;
    }


    /* =========================================================
       DESKTOP HOVER ONLY
    ========================================================= */

    @media
      (min-width: 1025px)
      and (hover: hover)
      and (pointer: fine) {

      .error-btn {

        transition:
          transform 0.32s cubic-bezier(.22,1,.36,1),
          box-shadow 0.32s ease,
          border-color 0.32s ease,
          background 0.32s ease;
      }


      .error-btn-primary:hover {

        transform: translateY(-5px);

        box-shadow:

          0 22px 45px rgba(25, 220, 255, 0.22),

          0 0 28px rgba(123, 69, 255, 0.12);
      }


      .error-btn-secondary:hover {

        transform: translateY(-5px);

        border-color: rgba(25, 220, 255, 0.42);

        background: rgba(7, 25, 42, 0.92);

        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.40);
      }
}


    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none !important;
      }
    }

    /* =========================================================
       TABLET
    ========================================================= */

    @media
      (max-width: 1024px),
      (hover: none),
      (pointer: coarse) {

      .background-photo {
        animation: none !important;
      }

      .error-btn {

        transition: none !important;
      }


      .error-btn:hover {

        transform: none !important;

        box-shadow: none !important;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .error-page {

        padding: 20px;
      }
.error-brand {

        font-size: 12px;

        letter-spacing: 5px;
      }


      .error-tagline {

        padding: 7px 13px;

        font-size: 7px;

        letter-spacing: 3px;

        margin-bottom: 17px;
      }


      .error-number {

        font-size: clamp(
          105px,
          30vw,
          170px
        );

        letter-spacing: -8px;

        line-height: 0.78;
      }


      .error-title {

        margin-top: 23px;

        font-size: 27px;

        letter-spacing: 3px;
      }


      .error-message {

        max-width: 410px;

        padding: 9px 13px;

        font-size: 11px;

        line-height: 1.7;

        margin-top: 13px;

        border-radius: 10px;
      }


      .error-actions {

        width: min(370px, 100%);

        display: grid;

        grid-template-columns: 1fr;

        gap: 9px;

        margin-top: 24px;
      }


      .error-btn {

        width: 100%;

        min-height: 49px;
      }


      .error-info {

        margin-top: 17px;

        gap: 7px;

        font-size: 7px;
      }

      .error-info span {

        min-height: 31px;

        padding: 0 9px;
      }


      .center-glow {

        width: 330px;

        height: 330px;
      }
    }


    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 420px) {
.error-brand {

        font-size: 10px;

        letter-spacing: 4px;
      }


      .error-tagline {

        padding: 6px 10px;

        font-size: 6px;

        letter-spacing: 2.5px;

        margin-bottom: 14px;
      }


      .error-number {

        font-size: 105px;

        letter-spacing: -7px;
      }


      .error-title {

        font-size: 24px;

        letter-spacing: 2px;

        margin-top: 21px;
      }


      .error-message {

        max-width: 315px;

        padding: 8px 11px;

        font-size: 10px;

        line-height: 1.65;

        border-radius: 9px;
      }


      .error-actions {

        margin-top: 21px;
      }


      .error-info {

        display: grid;

        grid-template-columns: 1fr 1fr;

        justify-items: center;

        gap: 6px;
      }

      .error-info span {

        min-height: 29px;

        padding: 0 7px;

        width: 100%;

        font-size: 6.5px;
      }
    }


    /* =========================================================
       SHORT SCREEN
    ========================================================= */

    @media (max-height: 700px) {

      .error-brand {

        font-size: 10px;
      }


      .error-tagline {

        margin-bottom: 13px;
      }


      .error-number {

        font-size: clamp(
          90px,
          22vh,
          170px
        );
      }


      .error-title {

        font-size: 26px;

        margin-top: 18px;
      }


      .error-message {

        margin-top: 8px;

        padding: 7px 10px;

        font-size: 10px;

        line-height: 1.6;
      }


      .error-actions {

        margin-top: 17px;
      }


      .error-info {

        margin-top: 13px;
      }
    }


    /* =========================================================
       VERY SHORT SCREEN
    ========================================================= */

    @media (max-height: 560px) {
.error-brand,
      .error-tagline,
      .error-info {

        display: none;
      }


      .error-number {

        font-size: 100px;
      }


      .error-title {

        margin-top: 17px;

        font-size: 24px;
      }


      .error-message {

        margin-top: 8px;
      }


      .error-actions {

        margin-top: 15px;
      }
    }

  </style>
</head>

0cy%3D%2275%22%20r%3D%221.5%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22430%22%20cy%3D%22130%22%20r%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22960%22%20cy%3D%22100%22%20r%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%221180%22%20cy%3D%2275%22%20r%3D%221.5%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%221470%22%20cy%3D%22125%22%20r%3D%222%22%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E'">

  <!-- =======================================================
       PREVIOUS PAGE SCRIPT
  ======================================================== -->

  <script>

    (function () {

      const backButton =
        document.getElementById("backPrevious");


      backButton.addEventListener(
        "click",
        function () {

          /*
            If there is browser history,
            go to the previous page.

            Otherwise,
            return to Stackly Home.
          */

          if (window.history.length > 1) {

            window.history.back();

          } else {

            window.location.href =
              "fm_dashboard.html";

          }

        }
      );

    })();

  </script>
