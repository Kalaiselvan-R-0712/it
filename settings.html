    <style>
        /* ===== GLOBAL STYLES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            min-height: 100vh; 
            overflow-x: hidden;
            overflow-y: auto;
    background: linear-gradient(135deg,#0b0b0b,#0b0b0b,#0b0b0b);
    color:#f5f5f5; 
}

        /* ===== HEADER ===== */
        header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 70px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 25px; background:#111111;
box-shadow: 0 4px 15px rgba(0,0,0,.06); border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            z-index: 2000; 
        }
        .header-left { display: flex; align-items: center; min-width: 0; }
        .logo img { height: 65px; flex-shrink: 0; }
        .hamburger { display: none; font-size: 20px; cursor: pointer; color: #fff; margin-right: 15px; flex-shrink: 0; }

        .profile { display: flex; gap: 15px; align-items: center; min-width: 0; }
        .profile-name{ color:#f5f5f5; }
.profile-email{ color:#8f8f98; }
.bell{ color:#f5f5f5; }

        /* Matched Bell Style to Dashboard */
        .bell { position: relative; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: 0.3s; }
        .bell span {
            position: absolute; top: -5px; right: -5px;
            background: #138CFF; color: #fff; font-size: 9px;
            padding: 2px 5px; border-radius: 50%;
        }

        .profile-info { display: flex; flex-direction: column; min-width: 0; }
        .profile-name { font-weight: 600; font-size: 13px; white-space: nowrap; text-transform: capitalize; }
        .profile-email { font-size: 11px; color:#8d8d95; white-space: nowrap; }

        /* ===== SIDEBAR ===== */
        .sidebar { 
            width: 250px; background:#111111;
border-right:1px solid rgba(255,255,255,.08); border-right: 1px solid rgba(255,255,255,0.08); 
            position: fixed; top: 70px; left: 0; height: calc(100vh - 70px); 
            padding: 20px 15px; transition: transform 0.3s ease; z-index: 1500; 
            display: flex; flex-direction: column; 
        }
        .sidebar-content {
    overflow-y: auto;
}
        .sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; color:#a4a4ad; text-decoration: none; font-size: 14px; margin-bottom: 5px; transition: 0.2s; }

.sidebar a:hover{
background:#0b0b0b;
color:#138CFF;
}

.sidebar a.active{
background:#138CFF;
color:#fff;
}
.sidebar .logout {
    color:#138CFF;
    border:1px solid rgba(19,140,255,0.12);
    cursor:pointer;
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:12px;
}

.sidebar a.logout:hover{
    background:rgba(19,140,255,.10);
    color:#138CFF;
    border-color:#138CFF;
}

.sidebar a.logout:hover i,
.sidebar a.logout:hover span{
    color:#138CFF;
}

        /* ===== MAIN CONTENT ===== */
        .main { margin-left: 250px; padding: 100px 30px 40px; transition: 0.3s; max-width: 100%; }
        
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        .card {
background:#111111;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 14px 40px rgba(0,0,0,.28);
}
        .card:hover{
border-color:#138CFF;
transform:translateY(-6px);
background:#111111;
box-shadow:0 18px 45px rgba(19,140,255,.18);
}
        .card i { color: #138CFF; font-size: 18px; margin-bottom: 10px; }
        .card h2 { font-size: 24px; font-weight: 800; }
        .card p { font-size: 12px; color:#8d8d95; }

        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-btn {
    background:#00D5FF;
    color:#06111F;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
    transition:all .3s ease;
}

.add-btn:hover {
    background:#138CFF;
    color:#06111F;
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(19,140,255,.30);
}

        .table-container { border-radius: 15px; overflow-x: auto; padding: 20px; margin-bottom: 40px; }
        .table-container {
background:#111111;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 14px 40px rgba(0,0,0,.28);
}
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { text-align: left; padding: 15px; color:#a4a4ad; font-size: 11px; text-transform: uppercase; border-bottom:1px solid rgba(255,255,255,.08); }
        td { padding: 15px; font-size: 14px; border-bottom:1px solid rgba(255,255,255,.055); }
        
        .status { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(19, 140, 255, 0.10); color: #138CFF; }
        .action-btn { background: none; border: none; color:#8d8d95; cursor: pointer; margin-right: 12px; font-size: 16px; transition: 0.2s; }
        .action-btn:hover { color: #138CFF; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 1400; }
        .overlay.active { opacity: 1; visibility: visible; }

        @media (max-width: 768px) {
            .hamburger { display: block; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main { margin-left: 0; padding: 90px 20px; }
            .profile-info { display: none; }
            .cards { grid-template-columns: 1fr 1fr; }
        }

        /* Moves the X to the LEFT side of the sidebar */
.mobile-close { 
    display: none; 
    justify-content: flex-start; /* Changed from flex-end to move X to the left */
    padding: 15px 20px; 
    cursor: pointer; 
    width: 100%;
}

/* Ensures the hamburger is visible and orange on mobile */

    display: none; 
    font-size: 24px; 
    cursor: pointer; 
    color: #138CFF !important; 
    margin-right: 15px; 
    flex-shrink: 0;
    align-items: center;

}

/* Fix for the password eye overlap from your screenshot */
input[type="password"] {
    padding-right: 45px !important; 
}

@media (max-width: 768px) {
    .hamburger { display: flex; }
